<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raporty Tygodniowe - TRANSCEND Polska</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="language-switcher">
                <button class="lang-btn" data-lang="en" title="English">🇬🇧</button>
                <button class="lang-btn active" data-lang="pl" title="Polski">🇵🇱</button>
            </div>
            <h1 id="page-title">📄 Raporty Tygodniowe</h1>
            <p id="page-subtitle">TRANSCEND Polska - Archiwalne Raporty</p>
        </header>

        <main>
            <div class="content-wrapper">
                <!-- PDF Viewer Section -->
                <div class="pdf-viewer-section">
                    <div id="pdf-container">
                        <p class="placeholder" id="placeholder-text">Wybierz raport, aby go wyświetlić</p>
                    </div>
                </div>

                <!-- Reports List Section -->
                <aside class="reports-list">
                    <h2 id="reports-heading">Wszystkie Raporty</h2>
                    <div id="reports-list" class="reports">
                        <p class="loading" id="loading-text">Ładowanie raportów...</p>
                    </div>
                </aside>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 TRANSCEND Polska. All rights reserved.</p>
        </footer>
    </div>

    <script>
        // Translations
        const translations = {
            en: {
                pageTitle: '📄 Weekly Reports',
                pageSubtitle: 'TRANSCEND Polska - Archived Reports',
                reportsHeading: 'Available Reports',
                placeholderText: 'Select a report to view it here',
                loadingText: 'Loading reports...',
                noReportsText: 'No reports found yet. Check back soon!',
                errorText: 'Error loading reports. Please try again.',
                errorPdfText: 'Error loading PDF. It may be too large. Try downloading instead.',
                downloadBtn: '⬇ Download'
            },
            pl: {
                pageTitle: '📄 Raporty Tygodniowe',
                pageSubtitle: 'TRANSCEND Polska - Archiwalne Raporty',
                reportsHeading: 'Wszystkie Raporty',
                placeholderText: 'Wybierz raport, aby go wyświetlić',
                loadingText: 'Ładowanie raportów...',
                noReportsText: 'Nie znaleziono raportów. Wróć wkrótce!',
                errorText: 'Błąd podczas ładowania raportów. Spróbuj ponownie.',
                errorPdfText: 'Błąd podczas ładowania PDF. Może być zbyt duży. Spróbuj pobrać zamiast tego.',
                downloadBtn: '⬇ Pobierz'
            }
        };

        let currentLanguage = 'pl';
        let currentPdf = null;
        let currentPage = 1;
        let totalPages = 0;

        // Set up PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Language switching
        function setLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('language', lang);
            
            // Update button states
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-lang="${lang}"]`).classList.add('active');
            
            // Update all text
            updatePageText();
            loadReports();
        }

        function updatePageText() {
            const t = translations[currentLanguage];
            document.getElementById('page-title').textContent = t.pageTitle;
            document.getElementById('page-subtitle').textContent = t.pageSubtitle;
            document.getElementById('reports-heading').textContent = t.reportsHeading;
            document.getElementById('placeholder-text').textContent = t.placeholderText;
            document.getElementById('loading-text').textContent = t.loadingText;
            document.documentElement.lang = currentLanguage;
        }

        // Load language preference on page load
        function loadLanguagePreference() {
            const saved = localStorage.getItem('language') || 'pl';
            setLanguage(saved);
        }

        // Language button event listeners
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    setLanguage(btn.dataset.lang);
                });
            });
        });

        async function loadReports() {
            try {
                // Fetch list of reports from the reports folder
                const response = await fetch('https://api.github.com/repos/michal-czarnecki-transcend/michal-czarnecki-transcend.github.io/contents/reports');
                const files = await response.json();
                const t = translations[currentLanguage];
                
                if (!Array.isArray(files)) {
                    document.getElementById('reports-list').innerHTML = `<p class="no-reports">${t.noReportsText}</p>`;
                    return;
                }

                const pdfFiles = files.filter(file => file.name.endsWith('.pdf')).sort((a, b) => b.name.localeCompare(a.name));

                if (pdfFiles.length === 0) {
                    document.getElementById('reports-list').innerHTML = `<p class="no-reports">${t.noReportsText}</p>`;
                    return;
                }

                let html = '';
                pdfFiles.forEach((file, index) => {
                    const date = file.name.replace('report-', '').replace('.pdf', '');
                    html += `
                        <div class="report-item" onclick="openPdf('${file.download_url}', '${file.name}')">
                            <div class="report-title">${file.name.replace('.pdf', '')}</div>
                            <div class="report-actions">
                                <a href="${file.download_url}" download class="btn-download" onclick="event.stopPropagation()">${t.downloadBtn}</a>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('reports-list').innerHTML = html;
                
                // Auto-load the first report
                if (pdfFiles.length > 0) {
                    openPdf(pdfFiles[0].download_url, pdfFiles[0].name);
                }
            } catch (error) {
                console.error('Error loading reports:', error);
                const t = translations[currentLanguage];
                document.getElementById('reports-list').innerHTML = `<p class="error">${t.errorText}</p>`;
            }
        }

        async function openPdf(url, fileName) {
            try {
                const t = translations[currentLanguage];
                document.getElementById('pdf-container').innerHTML = `<p class="loading">${t.loadingText}</p>`;
                
                const pdf = await pdfjsLib.getDocument(url).promise;
                currentPdf = pdf;
                totalPages = pdf.numPages;
                currentPage = 1;

                renderPage(1);
                updatePageInfo();
            } catch (error) {
                console.error('Error loading PDF:', error);
                const t = translations[currentLanguage];
                document.getElementById('pdf-container').innerHTML = `<p class="error">${t.errorPdfText}</p>`;
            }
        }

        async function renderPage(pageNum) {
            if (!currentPdf) return;

            try {
                const page = await currentPdf.getPage(pageNum);
                const scale = window.innerWidth > 1024 ? 1.5 : 1;
                const viewport = page.getViewport({ scale });

                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;

                document.getElementById('pdf-container').innerHTML = '';
                document.getElementById('pdf-container').appendChild(canvas);
                updatePageInfo();
            } catch (error) {
                console.error('Error rendering page:', error);
            }
        }

        function updatePageInfo() {
            // Page info could be added here if needed
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                renderPage(currentPage);
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderPage(currentPage);
            }
        }

        // Load language preference and reports when page loads
        document.addEventListener('DOMContentLoaded', loadLanguagePreference);

        // Handle responsive design
        window.addEventListener('resize', () => {
            if (currentPdf) {
                renderPage(currentPage);
            }
        });
    </script>
</body>
</html>
